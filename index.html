<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ionozond · практикум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  // Apply a saved theme before the first paint, so a dark choice does not flash light.
  try { var t = localStorage.getItem('pg-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#home">
      <span class="eyebrow" data-i18n="app.eyebrow"></span>
      <b data-i18n="app.title"></b>
    </a>
    <div class="prefs">
      <div class="theme" role="group">
        <button type="button" data-theme-set="auto"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
        <button type="button" data-theme-set="light"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button type="button" data-theme-set="dark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="lang" role="group" aria-label="Язык / Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>
  <nav class="rail"></nav>
  <main id="main"></main>
  <footer class="foot">
    <p data-i18n="foot.1"></p>
    <p data-i18n="foot.2"></p>
  </footer>
</div>

<script src="js/core.js"></script>
<script src="js/modules/gdd.js"></script>
<script src="js/modules/measure.js"></script>
<script src="js/modules/timing.js"></script>
<script src="js/modules/cells.js"></script>
<script src="js/modules/schedule.js"></script>
<script src="js/modules/daily.js"></script>
<script src="js/modules/vi.js"></script>
<script src="js/wiki/physics.js"></script>
<script src="js/modules/wiki.js"></script>
<script>PG.start();</script>
</body>
</html>
